<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <title>wedsite của saka</title>
   <style>
    body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f3f4f6;
    color: #222222;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #1f2937;
    padding: 15px 30px;
}

.navbar h2 {
    color: white;
}

.menu {
    display: flex;
    gap: 20px;
}

.menu a {
    color: white;
    text-decoration: none;
}

.hero {
    text-align: center;
    padding: 70px 20px;
    background-color: #dbeafe;
}

.about,
.hobbies {
    padding: 30px;
    text-align: center;
}

.cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    background-color: white;
    padding: 25px;
    width: 200px;
    min-height: 80px;
    box-sizing: border-box;

    border: 2px solid #d1d5db;
    border-radius: 20px;

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    transition: background-color 0.3s ease,
                transform 0.3s ease;
}

.card:hover {
    background-color: #bfdbfe;
    transform: translateY(-5px);
}
@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .menu {
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero {
        padding: 40px 15px;
    }

    .about,
    .hobbies {
        padding: 20px 15px;
    }

    .cards {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 100%;
        max-width: 300px;
    }
}
.menu a:hover {
    color: #93c5fd;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.brand h2 {
    margin: 0;
    color: white;
}
/* Hiệu ứng xuất hiện nhẹ nhàng */
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

body {
  animation: appear 1s ease-out both;
}

/* Chuyển động nhẹ khi rê chuột */
a, button {
  transition:
    color 0.3s ease,
    background-color 0.3s ease,
    opacity 0.3s ease;
}

a:hover, button:hover {
  opacity: 0.7;
}

/* Tôn trọng cài đặt giảm chuyển động */
@media (prefers-reduced-motion: reduce) {
  body {
    animation: none;
  }

  a, button {
    transition: none;
  }
}
/* Hiệu ứng xuất hiện lần lượt */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Nội dung chính */
header {
  animation: fadeUp 0.8s ease-out both;
}

main {
  animation: fadeUp 1s ease-out both;
  animation-delay: 0.2s;
}

footer {
  animation: fadeUp 1s ease-out both;
  animation-delay: 0.4s;
}

/* Ảnh phóng to nhẹ khi rê chuột */
img {
  transition: transform 0.35s ease;
}

img:hover {
  transform: scale(1.03);
}

/* Tắt chuyển động nếu người dùng yêu cầu */
@media (prefers-reduced-motion: reduce) {
  header,
  main,
  footer {
    animation: none;
  }

  img {
    transition: none;
  }
}
/* Cá nhỏ bơi ngang màn hình */
.fish-swimmer {
  position: fixed;
  left: 0;
  bottom: 28px;
  z-index: 999;
  width: 72px;
  color: #222;
  pointer-events: none;

  animation: fishSwim 18s linear infinite;
}

.fish-swimmer svg {
  display: block;
  width: 100%;
  height: auto;
}

/* Bơi sang phải rồi quay đầu bơi sang trái */
@keyframes fishSwim {
  0% {
    transform: translateX(-120px) scaleX(1);
  }

  49% {
    transform: translateX(calc(100vw + 120px)) scaleX(1);
  }

  50% {
    transform: translateX(calc(100vw + 120px)) scaleX(-1);
  }

  100% {
    transform: translateX(-120px) scaleX(-1);
  }
}
/* Ba chú cá lớn hơn gần tiêu đề */
.title-fish {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 32px;
  margin: 18px auto 26px;
  color: #333;
}

.tiny-fish {
  display: inline-block;
  font-size: 48px;
  line-height: 1.2;
  animation: littleSwim 2.4s ease-in-out infinite;
}

.fish-one {
  font-size: 42px;
  animation-delay: 0s;
}

.fish-two {
  font-size: 58px;
  animation-delay: 0.4s;
}

.fish-three {
  font-size: 46px;
  animation-delay: 0.8s;
}

@keyframes littleSwim {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }

  50% {
    transform: translateY(-9px) rotate(5deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .tiny-fish {
    animation: none;
  }
}
/* Góc ảnh nhỏ của Saka */
.gallery-section {
    padding: 35px 20px;
    text-align: center;
    background-color: #f3f4f6;
}

.gallery-section h2 {
    margin-bottom: 10px;
}

.gallery-section p {
    color: #6b7280;
}

.photo-gallery {
    max-width: 900px;
    margin: 25px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.photo-card {
    margin: 0;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
}

.photo-card img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.photo-card figcaption {
    padding: 13px;
    color: #374151;
    font-size: 14px;
}

@media (max-width: 600px) {
    .photo-card img {
        height: 190px;
    }
}
</style>
</head>
<body>
</div>
    <div class="title-fish" aria-hidden="true">
  <span class="tiny-fish fish-one">𓆝</span>
  <span class="tiny-fish fish-two">𓆟</span>
  <span class="tiny-fish fish-three">𓆝</span>
</div>
  <nav class="navbar">
    <div class="menu">
        <a href="#home">Trang chủ</a>
        <a href="#about">Giới thiệu</a>
        <a href="#hobbies">Sở thích</a>
    </div>
     <h2>SAKA</h2>
</nav>

<section id="home" class="hero">
    <h1>chào anh em!</h1>
    <p>tui dg thử lập wed.</p>
    <button onclick="changeGreeting()">Bấm thử đi</button>
    <button id="colorButton" onclick="changeBackground()">
    Đổi màu nền
</button>
<p id="greeting">Chưa có lời chào!</p>
<p id="counter">Bạn đã nhấn 0 lần.</p>
<button onclick="increase()">Nhấn để tăng 1 tình cảm</button>
<button onclick="resetCounter()">Đặt lại số đếm</button>
</section>

<section id="about" class="about">
    <h2>nếu bạn nhìn vào cái bàn và đọc nó 5 lần bạn sẽ thấy nó lạ</h2>
    <p>hÀi vcl.</p>
</section>
<section id="gallery" class="gallery-section">
    <h2>một góc nhỏ của tui</h2>
    <p>những thứ tui muốn lưu lại.</p>

    <div class="photo-gallery">

       <figure class="photo-card">
    <a href="images/fish.jpg" target="_blank" rel="noopener">
        <img src="images/fish.jpg" alt="Một chú cá">
    </a>
    <figcaption>cá 🐟</figcaption>
</figure>
        <figure class="photo-card">
            <a href="images/drawing.jpg" target="_blank" rel="noopener">
    <img src="images/drawing.jpg" alt="Tranh vẽ của tui">
    </a>
        </figure>

        <figure class="photo-card">
            <a href="images/sky.jpg" target="_blank" rel="noopener">
    <img src="images/sky.jpg" alt="Bầu trời">
</a>
        </figure>
    </div>
</section>
<section id="hobbies" class="hobbies">
    <h2>Đặc điểm của minh</h2>

    <div class="cards">
        <div class="card">mạnh</div>
        <div class="card">giàu</div>
        <div class="card">đẹp trai</div>
    </div>
</section>
<script>
function changeGreeting() {
    document.getElementById("greeting").textContent =
        "đọc là bị gay!";
}

let isDark = false;

function changeBackground() {
    isDark = !isDark;

    const button = document.getElementById("colorButton");

    if (isDark) {
        document.body.style.backgroundColor = "black";
        button.textContent = "Chuyển sang nền sáng";
    } else {
        document.body.style.backgroundColor = "lightblue";
        button.textContent = "Chuyển sang nền tối";
    }
}
let count = Number(localStorage.getItem("myCount")) || 0;

document.getElementById("counter").textContent =
    "Bạn đã nhấn " + count + " lần.";

function increase() {
    count = count + 1;

    localStorage.setItem("myCount", count);

    document.getElementById("counter").textContent =
        "Bạn đã nhấn " + count + " lần.";
}
function resetCounter() {
    count = 0;

    localStorage.setItem("myCount", count);

    document.getElementById("counter").textContent =
        "Bạn đã nhấn " + count + " lần.";
}
</script>
<!-- Chú cá bơi trên website -->
<div class="fish-swimmer" aria-hidden="true">
  <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <g fill="currentColor">
      <!-- Thân cá -->
      <ellipse cx="43" cy="30" rx="29" ry="18"/>

      <!-- Đuôi cá -->
      <path d="M17 30 L0 13 L0 47 Z"/>

      <!-- Vây trên -->
      <path d="M38 14 L49 3 L59 15 Z"/>

      <!-- Vây dưới -->
      <path d="M38 45 L48 55 L57 45 Z"/>
    </g>

    <!-- Mắt cá -->
    <circle cx="59" cy="25" r="2.5" fill="white"/>
    <circle cx="60" cy="25" r="1.2" fill="black"/>
  </svg>
</div>
</body>
</html>
